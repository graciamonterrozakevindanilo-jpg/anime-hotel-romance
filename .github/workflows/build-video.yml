name: Build 15s animatic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render MP4 animatic
        run: python render_animatic.py
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: anime-hotel-romance-mp4
          path: anime-hotel-romance.mp4
          if-no-files-found: error
          retention-days: 14
